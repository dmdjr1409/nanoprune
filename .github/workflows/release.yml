name: release

# Publishes a GitHub release: push a vX.Y.Z tag, or run this workflow from the
# Actions tab with the version number (the tag is then created on the commit
# the workflow runs on). The version must match pyproject.toml,
# nanoprune/__init__.py and a CHANGELOG.md section, whose text becomes the
# release notes. The wheel and the sdist are attached to the release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.7.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check the version and write the release notes
        env:
          REQUESTED: ${{ inputs.version || github.ref_name }}
        run: |
          VERSION="${REQUESTED#v}"
          python scripts/release_notes.py "$VERSION" > release-notes.md
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build the wheel and the sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check the built wheel
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install dist/*.whl
          test "$(/tmp/check/bin/nanoprune --version)" = "nanoprune $VERSION"
          /tmp/check/bin/nanoprune search "Contre-indication AINS" --dir sample_data/medical

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" dist/* \
            --title "NanoPrune v$VERSION" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA"
