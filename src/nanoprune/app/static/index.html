<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NanoPrune — Recherche locale</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="top-nav">
      <div class="brand">
        <span>NanoPrune</span>
        <span class="brand-tag" id="modelTag">…</span>
      </div>
      <div class="nav-actions">
        <button type="button" class="btn-import" id="btnImport" aria-expanded="false" aria-controls="importDrawer">
          <span aria-hidden="true">📁</span>
          <span>Changer de dossier…</span>
        </button>
        <span class="nav-status" id="statInfo">Chargement…</span>
      </div>
    </header>

    <div id="modeBanner" class="mode-banner" role="status" hidden></div>

    <section id="importDrawer" class="import-drawer" hidden>
      <div class="drawer-title">
        <span>Importer des dossiers ou des documents</span>
        <button type="button" class="close-btn" id="btnCloseDrawer" aria-label="Fermer">✕</button>
      </div>

      <div id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="Choisir un dossier à importer">
        <div class="dropzone-text">
          Glissez-déposez un dossier ou des fichiers ici, ou <strong>cliquez pour choisir un dossier</strong>
        </div>
        <span class="hint" id="formatsHint"></span>
      </div>
      <input id="folderInput" type="file" webkitdirectory multiple hidden>
      <input id="fileInput" type="file" multiple hidden>

      <div class="picker-row">
        <button type="button" class="btn-secondary" id="btnPickFiles">Choisir des fichiers…</button>
        <span class="hint">Tout reste sur cet ordinateur : les fichiers sont lus par le serveur local.</span>
      </div>

      <form class="path-row" id="pathForm">
        <input id="pathInput" class="path-input" type="text" autocomplete="off"
               placeholder="Ou un chemin local (ex : ~/Documents/Clients, sample_data/medical)">
        <button type="submit" class="btn-load-path">Charger</button>
      </form>

      <div id="importReport" class="import-report" hidden></div>
    </section>

    <section class="search-box">
      <div class="search-input-wrapper">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="q" class="search-input" type="search" autocomplete="off" autofocus
               placeholder="Rechercher dans les documents (ex : allergie Dupont, clause de préavis…)"
               aria-label="Recherche">
      </div>
      <div class="search-meta">
        <div class="quick-filters">
          <button type="button" class="filter-btn" data-query="Allergie pénicilline Dupont">Allergie Dupont</button>
          <button type="button" class="filter-btn" data-query="Contre-indication AINS Kardegic">Contre-indication Martin</button>
          <button type="button" class="filter-btn" data-query="Aucune allergie Sophie Bernard">Sans allergie Bernard</button>
        </div>
        <label class="threshold" for="threshold">
          Seuil
          <input id="threshold" type="range" min="0.20" max="0.95" step="0.05" value="0.45">
          <output id="thresholdValue" for="threshold">0.45</output>
        </label>
        <div id="latencyTag" class="latency">-- ms</div>
      </div>
    </section>

    <div id="results" class="results" aria-live="polite">
      <div class="empty">Tape une requête pour chercher dans les documents indexés.</div>
    </div>
  </div>
</body>
</html>
