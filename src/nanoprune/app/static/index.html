<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NanoPrune</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0e12;
      --panel: #16181f;
      --border: #232634;
      --border-focus: #3b82f6;
      --text: #f3f4f6;
      --text-muted: #8b92a5;
      --accent: #2563eb;
      --match: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      -webkit-font-smoothing: antialiased;
    }
    .app-shell {
      width: 100%;
      max-width: 760px;
    }
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      letter-spacing: -0.2px;
    }
    .brand-tag {
      background: #1f2330;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 500;
      padding: 2px 7px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }
    .nav-status {
      font-size: 12px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }
    
    /* Search Bar - Style Raycast / Linear */
    .search-box {
      position: relative;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      margin-bottom: 20px;
    }
    .search-box:focus-within {
      border-color: #3b82f6;
      box-shadow: 0 8px 30px rgba(59, 130, 246, 0.12);
    }
    .search-input-wrapper {
      display: flex;
      align-items: center;
      padding: 14px 18px;
      gap: 12px;
    }
    .search-icon {
      color: #64748b;
      flex-shrink: 0;
    }
    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 16px;
      font-family: inherit;
    }
    .search-input::placeholder {
      color: #525a70;
    }
    .search-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 18px 12px 18px;
      font-size: 12px;
      color: var(--text-muted);
      border-top: 1px solid rgba(255, 255, 255, 0.03);
    }
    .quick-filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .filter-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }
    .filter-btn:hover {
      background: #1f2330;
      color: #fff;
      border-color: #3b4256;
    }

    /* Results */
    .results {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .result-item {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 18px;
      transition: border-color 0.15s, background-color 0.15s;
    }
    .result-item:hover {
      border-color: #343a4e;
      background: #191c24;
    }
    .result-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .result-title {
      font-size: 13px;
      font-weight: 500;
      color: #93c5fd;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'JetBrains Mono', monospace;
    }
    .score-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(16, 185, 129, 0.1);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.25);
    }
    .proof-quote {
      font-size: 14px;
      color: #fff;
      line-height: 1.5;
      margin-bottom: 8px;
      padding-left: 10px;
      border-left: 2px solid #3b82f6;
    }
    .proof-quote strong {
      color: #60a5fa;
    }
    .full-context {
      font-size: 12.5px;
      color: #80889c;
      line-height: 1.55;
    }

    .empty {
      text-align: center;
      padding: 40px 20px;
      color: #555d73;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="top-nav">
      <div class="brand">
        <span>NanoPrune</span>
        <span class="brand-tag">v0.1</span>
      </div>
      <div class="nav-status">
        <span id="statInfo">Chargement...</span>
      </div>
    </header>

    <div class="search-box">
      <div class="search-input-wrapper">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="q" class="search-input" type="text" placeholder="Rechercher dans les dossiers (ex: allergie Dupont, ordonnance Martin...)" autofocus oninput="debounceSearch()" onkeydown="if(event.key==='Enter') doSearch()" />
      </div>
      <div class="search-meta">
        <div class="quick-filters">
          <button class="filter-btn" onclick="applyQuery('Allergie pénicilline Dupont')">Allergie Dupont</button>
          <button class="filter-btn" onclick="applyQuery('Contre-indication AINS Kardegic')">Contre-indication Martin</button>
          <button class="filter-btn" onclick="applyQuery('Aucune allergie Sophie Bernard')">Sans allergie Bernard</button>
        </div>
        <div id="latencyTag">-- ms</div>
      </div>
    </div>

    <div id="results" class="results">
      <div class="empty">Tape une requête pour chercher instantanément.</div>
    </div>
  </div>

  <script>
    let timer = null;

    function applyQuery(val) {
      document.getElementById('q').value = val;
      doSearch();
    }

    function debounceSearch() {
      clearTimeout(timer);
      timer = setTimeout(doSearch, 120);
    }

    function cleanMd(str) {
      if (!str) return '';
      return str
        .replace(/\[([^\]]+)\]/g, '') // remove [Patient Dupont] tag
        .replace(/#{1,6}\s+/g, '')     // remove ## headers
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/^\s*[-*]\s+/gm, '')  // remove list dashes
        .trim();
    }

    async function doSearch() {
      const query = document.getElementById('q').value.trim();
      const container = document.getElementById('results');
      if (!query) {
        container.innerHTML = '<div class="empty">Tape une requête pour chercher instantanément.</div>';
        document.getElementById('latencyTag').innerText = '-- ms';
        return;
      }

      try {
        const res = await fetch('/api/search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: query, threshold: 0.45, top_k: 5 })
        });
        const data = await res.json();
        document.getElementById('latencyTag').innerText = `${data.latency_ms} ms (${data.matches_retained} trouvés)`;

        if (!data.results || data.results.length === 0) {
          container.innerHTML = '<div class="empty">Aucune preuve pertinente trouvée (rejet du faux positif).</div>';
          return;
        }

        container.innerHTML = data.results.map(r => `
          <div class="result-item">
            <div class="result-top">
              <span class="result-title">📄 ${r.file_name}</span>
              <span class="score-badge">${r.confidence_pct} certifié</span>
            </div>
            <div class="proof-quote">${cleanMd(r.highlight)}</div>
            <div class="full-context">${cleanMd(r.text)}</div>
          </div>
        `).join('');

      } catch (err) {
        container.innerHTML = `<div class="empty">Erreur: ${err.message}</div>`;
      }
    }

    fetch('/api/status').then(r => r.json()).then(st => {
      document.getElementById('statInfo').innerText = `${st.indexed_chunks} extraits indexés • 100% hors-ligne`;
    });
  </script>
</body>
</html>
