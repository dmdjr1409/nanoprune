[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoprune"
version = "0.6.0"
description = "Local relevance scoring, semantic search and RAG context pruning, 100% offline."
readme = "README.md"
authors = [
    { name = "Junior Diomande", email = "diomandejunior14@hotmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["rag", "reranker", "system-one", "onnx", "pruner", "information-retrieval", "privacy", "local-ai", "bm25", "semantic-search", "embeddings"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "numpy>=1.20.0",
]

[project.optional-dependencies]
# Inference with the ONNX model (the v0.4+ WordPiece tokenizer needs `tokenizers`).
onnx = [
    "onnxruntime>=1.15.0",
    "tokenizers>=0.13.0",
]
# PyTorch inference, training and ONNX export.
train = [
    "torch>=2.0.0",
    "onnx>=1.14.0",
    "onnxruntime>=1.15.0",
    "tokenizers>=0.13.0",
]
# Semantic search with a sentence-embedding model (onnx is used for int8 quantisation).
semantic = [
    "onnxruntime>=1.15.0",
    "tokenizers>=0.13.0",
    "onnx>=1.14.0",
]
# PDF indexing in the local search app (.docx needs nothing extra).
docs = [
    "pypdf>=3.0.0",
]
all = [
    "torch>=2.0.0",
    "onnx>=1.14.0",
    "onnxruntime>=1.15.0",
    "tokenizers>=0.13.0",
    "pypdf>=3.0.0",
]

[project.scripts]
nanoprune = "nanoprune.cli:main"

[project.urls]
Homepage = "https://github.com/dmdjr1409/nanoprune"
Repository = "https://github.com/dmdjr1409/nanoprune"
Issues = "https://github.com/dmdjr1409/nanoprune/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nanoprune = ["app/static/*", "benchmarks/*.jsonl", "benchmarks/*.md"]
